# 工作流名称：部署网站到 Cloudflare Pages
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "LuciLinkWorldWeb/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare site files
        run: |
          test -f LuciLinkWorldWeb/index.html
          mkdir -p dist
          rsync -a \
            --exclude 'scripts/' \
            --exclude 'README.md' \
            ./LuciLinkWorldWeb/ dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lucilinkworld --commit-dirty=true
