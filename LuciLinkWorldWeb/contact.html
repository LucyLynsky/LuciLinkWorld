<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>联系 LuciLinkWorld</title>
  <link rel="icon" href="assets/logo/lucilink-gold.svg?v=33" type="image/svg+xml" />
  <link rel="stylesheet" href="css/site.css?v=41" />
</head>
<body data-page="contact">
  <header class="site-header" id="site-header"></header>
  <main id="main">
    <header class="page-hero">
      <div class="inner">
        <div class="kicker" data-i18n="contact.kicker"></div>
        <h1><img src="assets/logo/lucilink-gold.svg?v=33" alt="LuciLinkWorld" style="height:48px;width:auto" /></h1>
        <p data-i18n="contact.lead"></p>
      </div>
    </header>
    <section class="wrap">
      <div class="grid-2">
        <div>
          <h2 data-i18n="contact.how"></h2>
          <div class="channel"><span class="label" data-i18n="contact.name"></span><span class="value">LuciLinkWorld</span></div>
          <div class="channel"><span class="label" data-i18n="contact.email"></span><a class="value" href="mailto:LuciLinkWorld@gmail.com">LuciLinkWorld@gmail.com</a></div>
          <div class="channel"><span class="label" data-i18n="contact.wechat"></span><span class="value">LuciLinkWorld</span></div>
          <div class="channel"><span class="label" data-i18n="contact.whatsapp"></span><span class="value">LuciLinkWorld</span></div>
          <div class="channel"><span class="label" data-i18n="contact.place"></span><span class="value">Huaqiang North, Shenzhen, China</span></div>
          <div class="qr-row" style="margin-top:28px">
            <figure class="qr-card">
              <h3 data-i18n="contact.scanWechat"></h3>
              <img src="assets/contact/wechat_large.png?v=40" alt="WeChat QR LuciLinkWorld" />
            </figure>
            <figure class="qr-card">
              <h3 data-i18n="contact.scanWa"></h3>
              <img src="assets/contact/whatsapp_large.png?v=40" alt="WhatsApp QR LuciLinkWorld" />
            </figure>
          </div>
        </div>
        <form class="card pad form" id="enquiry" novalidate>
          <h3 data-i18n="contact.formTitle"></h3>
          <p class="form-status" id="form-status" hidden role="status"></p>
          <input class="form-hp" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">
          <label for="name" data-i18n="contact.fName"></label>
          <input id="name" name="name" autocomplete="name" required>
          <fieldset class="contact-methods">
            <legend>
              <span data-i18n="contact.fContact"></span>
              <span class="req" aria-hidden="true">*</span>
            </legend>
            <p class="field-hint" data-i18n="contact.fContactHint"></p>
            <div class="form-row">
              <div>
                <label for="email" data-i18n="contact.fEmail"></label>
                <input id="email" name="email" type="email" autocomplete="email">
              </div>
              <div>
                <label for="whatsapp" data-i18n="contact.fWhatsapp"></label>
                <input id="whatsapp" name="whatsapp" autocomplete="tel">
              </div>
            </div>
            <div class="form-row">
              <div>
                <label for="phone" data-i18n="contact.fPhone"></label>
                <input id="phone" name="phone" autocomplete="tel">
              </div>
              <div>
                <label for="wechat" data-i18n="contact.fWechat"></label>
                <input id="wechat" name="wechat">
              </div>
            </div>
          </fieldset>
          <p class="form-group-label" data-i18n="contact.fFrom"></p>
          <div class="form-row">
            <div>
              <label for="region" data-i18n="contact.fCountry"></label>
              <select id="region" name="region" required></select>
            </div>
            <div>
              <label for="city" data-i18n="contact.fCity"></label>
              <select id="city" name="city" required disabled></select>
            </div>
          </div>
          <div id="city-other-wrap" hidden>
            <label for="city-other" data-i18n="contact.fCityOther"></label>
            <input id="city-other" name="city_other" disabled>
          </div>
          <label for="item" data-i18n="contact.fItem"></label>
          <input id="item" name="item">
          <label for="message" data-i18n="contact.fMsg"></label>
          <textarea id="message" name="message"></textarea>
          <button class="btn" type="submit" id="form-submit" data-i18n="contact.send"></button>
          <div class="form-sent-mask" id="form-sent-mask" hidden>
            <div class="form-sent-box" role="alertdialog" aria-modal="true" aria-labelledby="form-sent-title">
              <p id="form-sent-title"></p>
              <button class="btn" type="button" id="form-sent-ok"></button>
            </div>
          </div>
        </form>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/data.js?v=43"></script>
  <script src="js/i18n.js?v=43"></script>
  <script src="js/app.js?v=41"></script>
</body>
</html>
