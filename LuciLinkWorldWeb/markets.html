<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>市场 — LuciLinkWorld</title>
  <link rel="icon" href="assets/logo/lucilink-gold.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body data-page="markets">
  <header class="site-header" id="site-header"></header>
  <main id="main">
    <header class="page-hero">
      <div class="inner">
        <div class="kicker" data-i18n="marketsPage.kicker"></div>
        <h1 data-i18n="marketsPage.title"></h1>
        <p data-i18n="marketsPage.lead"></p>
      </div>
    </header>
    <section class="wrap">
      <div class="grid-2">
        <article class="card pad">
          <div class="chip">CN</div>
          <h3 data-i18n="marketsPage.cnT"></h3>
          <p data-i18n="marketsPage.cnD"></p>
        </article>
        <article class="card pad">
          <div class="chip">ASEAN</div>
          <h3 data-i18n="marketsPage.seaT"></h3>
          <p data-i18n="marketsPage.seaD"></p>
        </article>
        <article class="card pad">
          <div class="chip">AF</div>
          <h3 data-i18n="marketsPage.afT"></h3>
          <p data-i18n="marketsPage.afD"></p>
        </article>
        <article class="card pad">
          <div class="chip">UK</div>
          <h3 data-i18n="marketsPage.ukT"></h3>
          <p data-i18n="marketsPage.ukD"></p>
        </article>
        <article class="card pad">
          <div class="chip">EU</div>
          <h3 data-i18n="marketsPage.euT"></h3>
          <p data-i18n="marketsPage.euD"></p>
        </article>
        <article class="card pad accent">
          <h3 data-i18n="marketsPage.howT"></h3>
          <p>1. <span data-i18n="marketsPage.how1"></span></p>
          <p>2. <span data-i18n="marketsPage.how2"></span></p>
          <p>3. <span data-i18n="marketsPage.how3"></span></p>
          <a class="btn" href="contact.html" style="margin-top:8px" data-i18n="nav.contact"></a>
        </article>
      </div>
    </section>
    <section class="band">
      <div class="wrap">
        <div class="grid-2">
          <img src="assets/source/foreign-trade.jpg" alt="SEG foreign trade floor" />
          <img src="assets/source/seg-atrium.jpg" alt="SEG electronics market atrium" />
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
