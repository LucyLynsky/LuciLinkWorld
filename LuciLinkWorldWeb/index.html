<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="LuciLinkWorld — electronics wholesale in Shenzhen and nearby. A few SKUs start from 50–100 pcs." />
  <title>LuciLinkWorld — 深圳及周边电子产品批发</title>
  <link rel="icon" href="assets/logo/lucilink-gold.svg?v=33" type="image/svg+xml" />
  <link rel="stylesheet" href="css/site.css?v=41" />
</head>
<body data-page="home">
  <header class="site-header" id="site-header"></header>
  <main id="main">
    <section class="hero">
      <div class="hero-copy">
        <div class="kicker" data-i18n="hero.kicker"></div>
        <h1><img src="assets/logo/lucilink-gold.svg?v=33" alt="LuciLinkWorld" /></h1>
        <p data-i18n="hero.title"></p>
        <p class="lead" data-i18n="hero.lead"></p>
        <div class="hero-actions">
          <a class="btn" href="products.html" data-i18n="hero.cta"></a>
          <a class="btn ghost" href="contact.html" data-i18n="hero.cta2"></a>
        </div>
      </div>
    </section>

    <section class="wrap">
      <div class="section-head">
        <div>
          <div class="kicker" style="color:var(--muted)" data-i18n="home.stockKicker"></div>
          <h2 data-i18n="home.stockTitle"></h2>
          <p class="lede" data-i18n="home.stockLead"></p>
        </div>
        <a class="btn dark" href="products.html" data-i18n="home.viewAll"></a>
      </div>
      <div class="grid-4" id="home-products"></div>
    </section>

    <section class="band">
      <div class="wrap">
        <div class="grid-2" style="align-items:center;gap:36px">
          <img src="assets/source/seg-plaza.jpg" alt="Huaqiang Electronics World, Shenzhen" />
          <div>
            <h2 data-i18n="home.whyTitle"></h2>
            <div class="card pad" style="margin-top:20px">
              <h3 data-i18n="home.why1t"></h3>
              <p data-i18n="home.why1d"></p>
            </div>
            <div class="card pad" style="margin-top:12px">
              <h3 data-i18n="home.why2t"></h3>
              <p data-i18n="home.why2d"></p>
            </div>
            <div class="card pad" style="margin-top:12px">
              <h3 data-i18n="home.why3t"></h3>
              <p data-i18n="home.why3d"></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="band dark">
      <div class="wrap">
        <div class="stat-row">
          <div class="stat"><b data-i18n="home.stats1"></b><span data-i18n="home.stats1l"></span></div>
          <div class="stat"><b data-i18n="home.stats2"></b><span data-i18n="home.stats2l"></span></div>
          <div class="stat"><b data-i18n="home.stats3"></b><span data-i18n="home.stats3l"></span></div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/data.js?v=43"></script>
  <script src="js/i18n.js?v=43"></script>
  <script src="js/app.js?v=41"></script>
</body>
</html>
